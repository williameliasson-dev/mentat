[package]
name = "tui"
version = "0.1.0"
description = "An example generated using the hello-world template"
authors = ["williameliasson-dev <williameliasson5@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
minimad = "0.16.0"
thiserror = "2.0.19"
directories = "6.0.0"

proto = { path = "../proto" }
loro = "1.16.2"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
crypto = { path = "../crypto" }
tonic = "0.14.6"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt", "net", "time"] }
hex = "0.4.3"

[lib]
name ="tui"
path ="src/lib.rs"

[dev-dependencies]
futures = "0.3.34"
object_store = "0.14.2"
sync = { path = "../sync" }
tokio = { version = "1.53.2", features = ["rt", "net", "macros"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tower = "0.5.3"
