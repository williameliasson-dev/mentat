[package]
name = "tui"
version = "0.1.0"
description = "An example generated using the hello-world template"
authors = ["williameliasson-dev <williameliasson5@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
minimad = "0.16.0"
# `bundled` compiles sqlite into the binary: no libsqlite3 on the host, so
# CI and the released binary do not depend on one being installed.
rusqlite = { version = "0.39", features = ["bundled"] }
thiserror = "2.0.19"
directories = "6.0.0"

proto = { path = "../proto" }

[lib]
name ="tui"
path ="src/lib.rs"
