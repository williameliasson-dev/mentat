name: Build

# A manual run: builds release binaries. Nothing to test here first — the
# Test workflow covers that — but the binaries from a red ref are useless,
# so a green Test run on this exact commit is required before anything
# builds.
#
# The release tags whatever version the root Cargo.toml carries — that is
# the single source of truth, and package managers will read it from there.
# Bump it in a normal commit first; this run refuses to re-tag a version.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so `bump` can find the latest one; history, so the release
          # notes can list commits.
          fetch-depth: 0

      # A stale commit is never worth binaries: the latest green Test run on
      # this branch must be exactly this commit.
      - name: Require a green test run
        run: |
          passing=$(gh run list \
            --workflow test.yml \
            --branch "$GITHUB_REF_NAME" \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // empty')
          if [ "$passing" != "$GITHUB_SHA" ]; then
            echo "no green Test run for $GITHUB_SHA — run the Test workflow first"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Determine the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tui") | .version')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists — bump the workspace version in Cargo.toml first"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-release
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Publish the release
        run: |
          bins=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].targets[] | select(.kind[0] == "bin") | "target/release/" + .name')
          gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes $bins
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
