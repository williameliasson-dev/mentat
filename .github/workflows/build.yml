name: Build

# A manual run: builds release binaries. Nothing to test here first — the
# Test workflow covers that — but the binaries from a red ref are useless,
# so a green Test run on this exact commit is required before anything
# builds.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A stale commit is never worth binaries: the latest green Test run on
      # this branch must be exactly this commit.
      - name: Require a green test run
        run: |
          passing=$(gh run list \
            --workflow test.yml \
            --branch "$GITHUB_REF_NAME" \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // empty')
          if [ "$passing" != "$GITHUB_SHA" ]; then
            echo "no green Test run for $GITHUB_SHA — run the Test workflow first"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Use devenv's binary cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Build the devenv --profile ci shell
        run: devenv --profile ci shell -- true

      - name: Put the devenv toolchain on PATH
        run: echo "$PWD/.devenv/profile/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build release binaries
        run: devenv --profile ci shell -- cargo build --workspace --release --locked

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            target/release/sync
            target/release/tui
          if-no-files-found: error
