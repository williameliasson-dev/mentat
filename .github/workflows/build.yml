name: Build

# A manual run: builds release binaries. Nothing to test here first — the
# Test workflow covers that — but the binaries from a red ref are useless,
# so a green Test run on this exact commit is required before anything
# builds.
#
# The release tags each binary crate by the version its own Cargo.toml
# carries — tui and sync ship separately, so each gets `tui-v#.#.#` /
# `sync-v#.#.#` tags and its own release assets. Bump a crate's version in
# a normal commit first; this run refuses to re-tag a version.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so a version can be checked against its last release;
          # history, so the release notes can list commits.
          fetch-depth: 0

      # A stale commit is never worth binaries: the latest green Test run on
      # this branch must be exactly this commit.
      - name: Require a green test run
        run: |
          passing=$(gh run list \
            --workflow test.yml \
            --branch "$GITHUB_REF_NAME" \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // empty')
          if [ "$passing" != "$GITHUB_SHA" ]; then
            echo "no green Test run for $GITHUB_SHA — run the Test workflow first"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-release
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Publish the releases
        run: |
          tags=""
          for crate in tui sync; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')
            tag="$crate-v$version"
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "$tag exists already, skipping"
            else
              gh release create "$tag" --target "$GITHUB_SHA" --generate-notes "target/release/$crate"
              tags="$tags $tag"
            fi
          done
          [ -n "$tags" ] || { echo "nothing to release — bump a crate's version first"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
