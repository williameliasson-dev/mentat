name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    # Dev credentials, same ones devenv uses locally: only the local
    # versitygw below ever sees them.
    env:
      S3_ENDPOINT: http://127.0.0.1:7070
      S3_BUCKET: vaults
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: mentat-dev
      S3_SECRET_ACCESS_KEY: mentat-dev-secret
      S3_DATA_DIR: /tmp/mentat-s3

    steps:
      - uses: actions/checkout@v4

      # Caches compiled dependencies and crate downloads, pruning stale
      # artifacts rather than storing the whole multi-GB `target`. Its key
      # tracks the rustc version, so a toolchain bump invalidates correctly.
      # Only master saves, so pull requests restore from it without each
      # writing a cache into the 10GB per-repo budget.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Only the bucket: `sync`'s integration tests need a real S3 (the
      # conditional writes they check are the bucket's), while `tui` and
      # `daemon` tests use in-memory and temp-dir vaults.
      - name: Install versitygw
        run: |
          curl -sSfL https://github.com/versity/versitygw/releases/download/v1.8.0/versitygw_v1.8.0_Linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin versitygw_v1.8.0_Linux_x86_64/versitygw --strip-components 1

      - name: Start s3
        run: |
          mkdir -p "$S3_DATA_DIR/$S3_BUCKET"
          versitygw --port 127.0.0.1:7070 \
            --access "$S3_ACCESS_KEY_ID" --secret "$S3_SECRET_ACCESS_KEY" \
            posix "$S3_DATA_DIR" > /tmp/versitygw.log 2>&1 &
          # A bucket is just a directory here, so creating it is a mkdir;
          # the wait is only for the listener.
          timeout 30 bash -c 'until curl -s -o /dev/null "$S3_ENDPOINT"; do sleep 1; done'

      - name: Test
        run: cargo test --workspace --locked
