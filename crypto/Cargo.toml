[package]
name = "crypto"
version.workspace = true
description = "Client-side account keys and vault encryption"
authors = ["williameliasson-dev <williameliasson5@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = "1.28.0"
zeroize = { version = "1.9.1", features = ["derive"] }

[lib]
name = "crypto"
path = "src/lib.rs"
