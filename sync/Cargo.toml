[package]
name = "sync"
version.workspace = true
description = "sync server"
authors = ["williameliasson-dev <williameliasson5@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
http = "1.5.0"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1", features = ["full"] }
tonic = "0.14.6"
tower = "0.5.3"
uuid = { version = "1.25.0", features = ["serde", "v4"] }

proto = { path = "../proto" }
object_store = { version = "0.14.2", features = ["aws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
bytes = "1.12.1"
futures = "0.3.34"

[lib]
name ="sync"
path ="src/lib.rs"

[dev-dependencies]
crypto = { path = "../crypto" }
tokio-stream = { version = "0.1.19", features = ["net"] }
