syntax = "proto3";

package sync.account.v1;

import "google/protobuf/timestamp.proto";

// Public surface: reachable without an account key, since this is where keys
// come from.
service AccountRegistry {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
}

// Authenticated surface: every rpc requires a valid account key, sent as
// `authorization: Bearer <key>` metadata.
service Accounts {
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
}

message CreateAccountRequest {}

message CreateAccountResponse {
  Account account = 1;
  // Plaintext account key. Only ever returned here, once, at creation.
  string account_key = 2;
}

message GetAccountRequest {
  string id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message AuthenticateRequest {
  string account_key = 1;
}

message AuthenticateResponse {
  Account account = 1;
}

message Account {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
}
